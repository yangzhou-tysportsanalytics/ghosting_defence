[project]
name = "ghost-defense"
version = "0.0.1"
description = "Ghost defense & matchup inference on public 2015-16 SportVU tracking data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "polars>=1.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "torch>=2.2",
    "jax>=0.4.30",
    "numpyro>=0.15",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "matplotlib>=3.8",
    "imageio-ffmpeg>=0.5",
    "py7zr>=0.21",
    "requests>=2.31",
    "tqdm>=4.66",
    "nbacore",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghost"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
nbacore = { git = "https://github.com/yangzhou-tysportsanalytics/nbacore", tag = "data-v1.6" }
